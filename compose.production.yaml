services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: digipm
      POSTGRES_USER: digipm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digipm"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      target: app
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://digipm:${POSTGRES_PASSWORD}@postgres:5432/digipm
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public application URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random secret}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM to a sender on a domain verified in Resend}
      AI_MODEL: ${AI_MODEL:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      LOG_REQUESTS: "true"
    volumes:
      - assets_data:/data/assets
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  assets_data:
