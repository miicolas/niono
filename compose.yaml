services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: digipm
      POSTGRES_USER: digipm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digipm"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
